<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClimPro Manager</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
body { background:#f0f4f8; color:#333; font-size:15px; padding-bottom:80px; }
#loginScreen { position:fixed; inset:0; background:linear-gradient(135deg,#0066cc,#00a8e8); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
.login-box { background:white; padding:40px; border-radius:20px; max-width:400px; width:100%; text-align:center; }
.login-box h1 { color:#0066cc; margin-bottom:10px; }
.login-box input { width:100%; padding:14px; border:2px solid #e0e0e0; border-radius:10px; font-size:1em; margin-bottom:15px; text-align:center; }
.login-box button { width:100%; padding:14px; background:#0066cc; color:white; border:none; border-radius:10px; font-size:1em; font-weight:600; cursor:pointer; }
header { background:linear-gradient(135deg,#0066cc,#00a8e8); color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
.logo { font-size:1.3em; font-weight:bold; }
.header-actions { display:flex; gap:10px; }
.header-actions button { background:rgba(255,255,255,0.2); color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
nav { background:white; display:flex; overflow-x:auto; position:sticky; top:60px; z-index:99; }
nav button { flex:1; min-width:110px; padding:15px 10px; background:none; border:none; cursor:pointer; font-size:0.9em; color:#666; border-bottom:3px solid transparent; white-space:nowrap; }
nav button.active { color:#0066cc; border-bottom-color:#0066cc; }
main { padding:20px; max-width:1200px; margin:0 auto; }
.page { display:none; }
.page.active { display:block; }
h2 { color:#0066cc; margin-bottom:20px; }
h3 { color:#0066cc; margin-bottom:15px; }
.greeting { background:white; padding:20px; border-radius:15px; margin-bottom:20px; border-left:5px solid #00a8e8; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; margin-bottom:25px; }
.stat-card { background:white; padding:20px; border-radius:15px; text-align:center; border-left:4px solid #00a8e8; }
.stat-card .number { font-size:1.8em; font-weight:bold; color:#0066cc; }
.stat-card .label { color:#666; font-size:0.85em; }
.stat-card.warning { border-left-color:#ff9800; }
.stat-card.danger { border-left-color:#dc3545; }
.stat-card.success { border-left-color:#28a745; }
.card { background:white; padding:20px; border-radius:15px; margin-bottom:20px; }
.card-list-item { padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.form-group { margin-bottom:15px; }
.form-group label { display:block; margin-bottom:6px; color:#0066cc; font-weight:600; font-size:0.9em; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:11px; border:2px solid #e0e0e0; border-radius:10px; font-size:1em; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.btn { display:inline-block; padding:11px 20px; background:#0066cc; color:white; border:none; border-radius:10px; font-size:0.95em; font-weight:600; cursor:pointer; }
.btn-success { background:#28a745; }
.btn-warning { background:#ff9800; }
.btn-danger { background:#dc3545; }
.btn-gray { background:#6c757d; }
.btn-sm { padding:7px 12px; font-size:0.85em; }
.btn-block { width:100%; display:block; text-align:center; }
table { width:100%; border-collapse:collapse; }
th { background:#0066cc; color:white; padding:12px; text-align:left; font-size:0.85em; }
td { padding:12px; border-bottom:1px solid #eee; }
.badge { padding:4px 10px; border-radius:20px; font-size:0.78em; font-weight:600; display:inline-block; }
.badge-success { background:#d4edda; color:#155724; }
.badge-warning { background:#fff3cd; color:#856404; }
.badge-danger { background:#f8d7da; color:#721c24; }
.badge-info { background:#d1ecf1; color:#0c5460; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; padding:20px; align-items:flex-start; justify-content:center; overflow-y:auto; }
.modal.active { display:flex; }
.modal-content { background:white; padding:25px; border-radius:20px; max-width:600px; width:100%; margin:auto; max-height:95vh; overflow-y:auto; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.close-btn { background:none; border:none; font-size:1.8em; cursor:pointer; color:#666; }
.modal-actions { display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn { flex:1; }
.search-bar { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
.search-bar input { flex:1; min-width:200px; padding:11px 15px; border:2px solid #e0e0e0; border-radius:10px; }
.icon-btn { width:36px; height:36px; border-radius:8px; border:none; cursor:pointer; font-size:1em; }
.icon-call { background:#e3f2fd; }
.icon-wa { background:#dcf8c6; }
.icon-edit { background:#fff3cd; }
.icon-del { background:#f8d7da; }
.icon-done { background:#d4edda; }
.action-group { display:flex; gap:5px; flex-wrap:wrap; }
.alert { padding:14px 18px; border-radius:10px; margin-bottom:15px; display:none; }
.alert.show { display:block; }
.empty { text-align:center; padding:40px 20px; color:#666; }
.empty .icon { font-size:3em; opacity:0.4; }
</style>
</head>
<body>
